name: CI

# Consolidates the three ci.yml files that used to live in packages/scorm/.github
# and example/.github. GitHub Actions only reads .github/workflows from the
# repository ROOT, so those never ran: typecheck, tests and builds were not
# validated by CI at all.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Typecheck, test & build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # TEMPORARY, mirrors the same workaround in angular-smoke.yml.
      # package-lock.json was generated on macOS and is missing the installable
      # entry for @rolldown/binding-linux-x64-gnu (npm/cli#4828), so `npm ci` on
      # a Linux runner leaves vitest without its native binding and every test
      # file fails to load. A fresh install resolves the right platform binaries.
      # The pnpm migration removes this: pnpm records every platform variant in
      # the lockfile and filters them at install time.
      # The npm bundled with Node 22 also crashes here with
      # "Cannot read properties of null (reading 'edgesOut')" (an arborist bug
      # on workspace installs), so pin a newer npm first.
      # Pinned to 11: npm@latest is 12.x, which requires Node >= 22.
      - run: npm install -g npm@11
      - run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund

      - name: Typecheck (library)
        run: npm run typecheck --workspace=packages/scorm

      - name: Test (library)
        run: npm run test:run --workspace=packages/scorm

      - name: Build (library)
        run: npm run build --workspace=packages/scorm

      - name: Lint (example)
        run: npm run lint --workspace=example

      # After the library build: the example resolves @studiolxd/scorm through
      # the workspace, whose `exports` point at dist/.
      - name: Build (example)
        run: npm run build --workspace=example
